<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eko-Życie - Kalkulator Wskaźnika Eko-Index</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .main-layout {
                grid-template-columns: 3fr 2fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background-color: #fff;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .result-panel {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 20px;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--primary-light);
            border: 5px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .score-num {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            line-height: 1;
        }

        .score-unit {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .rating-badge {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--primary);
            color: white;
            margin-bottom: 15px;
        }

        .feedback-box {
            text-align: left;
            background: #fafafa;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            width: 100%;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Eko-Index Kalkulator</h1>
        <p>Wybierz swoje codzienne nawyki i sprawdź swój wskaźnik ekologiczny</p>
    </header>

    <div class="main-layout">
        <!-- Karta formularza -->
        <div class="card">
            <div class="form-group">
                <label for="energy">1. Źródło i zużycie energii w domu</label>
                <select id="energy" onchange="calculateScore()">
                    <option value="25">Zielona energia (OZE) / Fotowoltaika / Świadome oszczędzanie</option>
                    <option value="15" selected>Standardowa sieć / Przeciętne zużycie</option>
                    <option value="5">Wysokie zużycie / Częste korzystanie z urządzeń o dużej mocy</option>
                </select>
            </div>

            <div class="form-group">
                <label for="transport">2. Główny środek transportu</label>
                <select id="transport" onchange="calculateScore()">
                    <option value="25">Komunikacja miejska / Rower / Pieszo / Samochód elektryczny</option>
                    <option value="15" selected>Samochód hybrydowy / Wspólne przejazdy (carpooling)</option>
                    <option value="5">Samochód spalinowy (jazda w pojedynkę)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="waste">3. Segregacja odpadów i plastik</label>
                <select id="waste" onchange="calculateScore()">
                    <option value="25">Rygorystyczna segregacja / Własne torby / Unikanie plastiku (Zero Waste)</option>
                    <option value="15" selected>Okazjonalna segregacja / Czasem kupuję plastik jednorazowy</option>
                    <option value="5">Brak segregacji / Dużo opakowań jednorazowych i reklamówek</option>
                </select>
            </div>

            <div class="form-group">
                <label for="diet">4. Dieta i nawyki konsumenckie</label>
                <select id="diet" onchange="calculateScore()">
                    <option value="25">Weganizm lub wegetarianizm / Produkty lokalne / Brak marnowania żywności</option>
                    <option value="15" selected>Zbilansowana dieta / Mało mięsa / Rzadkie marnowanie jedzenia</option>
                    <option value="5">Dużo mięsa i przetworzonej żywności / Często zamawiam na wynos / Marnuję jedzenie</option>
                </select>
            </div>
        </div>

        <!-- Karta wyników -->
        <div class="card result-panel">
            <div class="score-circle">
                <span class="score-num" id="scoreDisplay">60</span>
                <span class="score-unit">pkt</span>
            </div>
            <div class="rating-badge" id="ratingDisplay">Eko-Nowicjusz</div>
            <div class="feedback-box">
                <div class="feedback-title">Rekomendacja:</div>
                <div id="feedbackDisplay">Ładnie! Masz już podstawową świadomość ekologiczną. Aby uzyskać lepszy wynik, spróbuj ograniczyć plastik jednorazowy lub częściej wybierać komunikację miejską.</div>
            </div>
        </div>
    </div>
</div>

<script>
    function calculateScore() {
        // Pobieranie wartości z opcji
        const energy = parseInt(document.getElementById('energy').value);
        const transport = parseInt(document.getElementById('transport').value);
        const waste = parseInt(document.getElementById('waste').value);
        const diet = parseInt(document.getElementById('diet').value);

        // Sumowanie punktów
        const totalScore = energy + transport + waste + diet;

        // Aktualizacja wyniku tekstowego
        document.getElementById('scoreDisplay').innerText = totalScore;

        // Pobieranie elementów DOM do zmiany stylów i tekstów
        const ratingBadge = document.getElementById('ratingDisplay');
        const feedbackDisplay = document.getElementById('feedbackDisplay');
        const scoreCircle = document.querySelector('.score-circle');

        // Dynamiczna zmiana ocen i kolorów w zależności od wyniku
        if (totalScore >= 85) {
            ratingBadge.innerText = "Obrońca Ziemi";
            ratingBadge.style.background = "#1b5e20";
            scoreCircle.style.borderColor = "#1b5e20";
            feedbackDisplay.innerText = "Wspaniale! Twój styl życia jest wyjątkowo niskoemisyjny. Swoimi działaniami realnie odciążasz planetę. Oby tak dalej – inspiruj innych!";
        } else if (totalScore >= 60) {
            ratingBadge.innerText = "Eko-Nowicjusz";
            ratingBadge.style.background = "#2e7d32";
            scoreCircle.style.borderColor = "#2e7d32";
            feedbackDisplay.innerText = "Dobry wynik! Masz już podstawową świadomość ekologiczną. Spróbuj podjąć wyzwanie „Zero Waste” lub wprowadź jeden dzień bez mięsa w tygodniu, aby wejść na wyższy poziom.";
        } else {
            ratingBadge.innerText = "Wysoki Ślad Węglowy";
            ratingBadge.style.background = "#c62828";
            scoreCircle.style.borderColor = "#c62828";
            feedbackDisplay.innerText = "Uwaga! Twoje codzienne nawyki generują spory ślad węglowy. Warto zacząć od małych zmian, takich jak dokładniejsza segregacja odpadów czy wybór roweru na krótkich dystansach.";
        }
    }

    // Uruchomienie kalkulatora przy starcie strony
    window.onload = calculateScore;
</script>

</body>
</html>
